[TextEditor]
FontFamily=JetBrains Mono
FontSize=11
FontAntialias=true

[textDisplaySettings]
HighlightCurrentLine2Key=true
HightlightMatchingParenthesesKey=true
AnimateMatchingParenthesesKey=false
DisplayLineNumbers=true
DisplayFoldingMarkers=true
MarkTextChanges=true
ScrollBarHighlights=true
VisualizeWhitespace=false
ShowMargin=true
MarginColumn=100
AnimateNavigationWithinFile=false

[MainWindow]
ModeSelectorLayout=1

[ProjectExplorer]
Settings\AutoRestoreLastSession=true
